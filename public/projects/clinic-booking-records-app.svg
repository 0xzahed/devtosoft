<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <rect width="1200" height="675" fill="#141414"/>
  <defs>
    <linearGradient id="g4" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#g4)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>
  <!-- glow -->
  <circle cx="1000" cy="500" r="200" fill="#c4f000" fill-opacity="0.06"/>
  <!-- heartbeat line -->
  <g stroke="#c4f000" stroke-width="3" fill="none">
    <path d="M 60 340 L 200 340 L 240 280 L 280 400 L 320 260 L 360 420 L 400 340 L 600 340 L 640 300 L 680 380 L 720 340 L 1140 340"/>
  </g>
  <!-- medical cross -->
  <g>
    <rect x="900" y="180" width="120" height="120" rx="12" fill="#c4f000" fill-opacity="0.15" stroke="#c4f000" stroke-width="2"/>
    <rect x="948" y="200" width="24" height="80" rx="4" fill="#c4f000"/>
    <rect x="920" y="228" width="80" height="24" rx="4" fill="#c4f000"/>
  </g>
  <!-- phone mockup -->
  <g>
    <rect x="80" y="430" width="160" height="210" rx="20" fill="#1e1e1e" stroke="#c4f000" stroke-opacity="0.3" stroke-width="2"/>
    <rect x="92" y="450" width="136" height="170" rx="8" fill="#0d0d0d"/>
    <circle cx="160" cy="470" r="4" fill="#c4f000"/>
    <text x="100" y="500" font-family="monospace" font-size="9" fill="#c4f000">APPOINTMENT</text>
    <text x="100" y="520" font-family="Arial Narrow" font-size="18" fill="#fff">Dr. Rahman</text>
    <text x="100" y="538" font-family="monospace" font-size="9" fill="#999">Cardiology</text>
    <rect x="100" y="555" width="120" height="30" rx="6" fill="#c4f000" fill-opacity="0.2" stroke="#c4f000" stroke-opacity="0.4"/>
    <text x="110" y="575" font-family="monospace" font-size="10" fill="#c4f000">Tue, 10:30 AM</text>
    <rect x="100" y="595" width="120" height="6" rx="3" fill="#333"/>
    <rect x="100" y="595" width="90" height="6" rx="3" fill="#c4f000"/>
  </g>
  <!-- calendar dots -->
  <g>
    <rect x="500" y="430" width="300" height="180" rx="8" fill="#1e1e1e" stroke="#c4f000" stroke-opacity="0.2"/>
    <text x="520" y="460" font-family="monospace" font-size="11" fill="#c4f000" letter-spacing="2">SCHEDULE</text>
    <g fill="#c4f000" fill-opacity="0.3">
      <circle cx="540" cy="490" r="6"/>
      <circle cx="580" cy="490" r="6"/>
      <circle cx="620" cy="490" r="6"/>
      <circle cx="660" cy="490" r="6"/>
      <circle cx="700" cy="490" r="6"/>
      <circle cx="740" cy="490" r="6"/>
      <circle cx="780" cy="490" r="6"/>
    </g>
    <g fill="#c4f000">
      <circle cx="540" cy="530" r="8"/>
      <circle cx="620" cy="530" r="8"/>
      <circle cx="700" cy="530" r="8"/>
      <circle cx="780" cy="530" r="8"/>
    </g>
    <g fill="#c4f000" fill-opacity="0.5">
      <circle cx="580" cy="530" r="6"/>
      <circle cx="660" cy="530" r="6"/>
      <circle cx="740" cy="530" r="6"/>
    </g>
    <text x="520" y="580" font-family="Arial Narrow" font-size="24" fill="#fff">22,041</text>
    <text x="520" y="600" font-family="monospace" font-size="10" fill="#999">appointments this month</text>
  </g>
  <!-- label -->
  <text x="60" y="80" font-family="monospace" font-size="14" fill="#c4f000" letter-spacing="3">HEALTH / MEDICORE</text>
  <text x="60" y="160" font-family="Arial Narrow, sans-serif" font-size="48" fill="#ffffff" font-weight="bold">CLINIC</text>
  <text x="60" y="210" font-family="Arial Narrow, sans-serif" font-size="48" fill="#c4f000" font-weight="bold">BOOKING APP</text>
</svg>
