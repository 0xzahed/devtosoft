<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <rect width="1200" height="675" fill="#141414"/>
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <radialGradient id="liveglow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#c4f000" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#c4f000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#g5)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>
  <!-- glow -->
  <circle cx="600" cy="340" r="280" fill="url(#liveglow)"/>
  <!-- video tiles -->
  <g>
    <rect x="100" y="240" width="180" height="120" rx="8" fill="#1e1e1e" stroke="#c4f000" stroke-opacity="0.3"/>
    <circle cx="190" cy="300" r="24" fill="#c4f000" fill-opacity="0.2"/>
    <text x="190" y="306" font-family="Arial Narrow" font-size="20" fill="#c4f000" text-anchor="middle">A</text>
    <circle cx="120" cy="350" r="4" fill="#c4f000"/>

    <rect x="300" y="240" width="180" height="120" rx="8" fill="#1e1e1e" stroke="#c4f000" stroke-opacity="0.3"/>
    <circle cx="390" cy="300" r="24" fill="#c4f000" fill-opacity="0.2"/>
    <text x="390" y="306" font-family="Arial Narrow" font-size="20" fill="#c4f000" text-anchor="middle">B</text>

    <rect x="500" y="240" width="180" height="120" rx="8" fill="#1e1e1e" stroke="#c4f000" stroke-opacity="0.3"/>
    <circle cx="590" cy="300" r="24" fill="#c4f000" fill-opacity="0.2"/>
    <text x="590" y="306" font-family="Arial Narrow" font-size="20" fill="#c4f000" text-anchor="middle">C</text>

    <rect x="700" y="240" width="180" height="120" rx="8" fill="#1e1e1e" stroke="#c4f000" stroke-opacity="0.3"/>
    <circle cx="790" cy="300" r="24" fill="#c4f000" fill-opacity="0.2"/>
    <text x="790" y="306" font-family="Arial Narrow" font-size="20" fill="#c4f000" text-anchor="middle">D</text>

    <rect x="900" y="240" width="180" height="120" rx="8" fill="#c4f000" fill-opacity="0.15" stroke="#c4f000" stroke-width="2"/>
    <circle cx="990" cy="300" r="24" fill="#c4f000" fill-opacity="0.3"/>
    <text x="990" y="306" font-family="Arial Narrow" font-size="20" fill="#c4f000" text-anchor="middle">T</text>
    <rect x="910" y="250" width="50" height="18" rx="4" fill="#c4f000"/>
    <text x="935" y="263" font-family="monospace" font-size="10" fill="#141414" text-anchor="middle" font-weight="bold">LIVE</text>
  </g>
  <!-- whiteboard -->
  <g>
    <rect x="100" y="400" width="980" height="200" rx="8" fill="#1a1a1a" stroke="#c4f000" stroke-opacity="0.2"/>
    <text x="120" y="430" font-family="monospace" font-size="11" fill="#c4f000" letter-spacing="2">WHITEBOARD</text>
    <g stroke="#c4f000" stroke-width="2" fill="none">
      <path d="M 140 470 L 300 470 L 300 560 L 140 560 Z"/>
      <path d="M 340 470 L 500 470"/>
      <path d="M 340 500 L 460 500"/>
      <path d="M 340 530 L 480 530"/>
      <circle cx="600" cy="500" r="40" stroke-dasharray="6 4"/>
      <path d="M 580 500 L 595 515 L 620 485"/>
    </g>
    <g stroke="#ffffff" stroke-opacity="0.2" stroke-width="2" fill="none">
      <path d="M 700 470 L 900 470"/>
      <path d="M 700 500 L 860 500"/>
      <path d="M 700 530 L 880 530"/>
      <path d="M 700 560 L 840 560"/>
    </g>
    <g fill="#c4f000" fill-opacity="0.3">
      <rect x="940" y="460" width="120" height="30" rx="4"/>
      <rect x="940" y="500" width="120" height="30" rx="4"/>
      <rect x="940" y="540" width="120" height="30" rx="4"/>
    </g>
  </g>
  <!-- live indicator -->
  <g>
    <circle cx="1100" cy="100" r="8" fill="#c4f000">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="1075" y="105" font-family="monospace" font-size="11" fill="#c4f000" text-anchor="end">50,000 ONLINE</text>
  </g>
  <!-- label -->
  <text x="60" y="80" font-family="monospace" font-size="14" fill="#c4f000" letter-spacing="3">EDUCATION / LEARNLOOP</text>
  <text x="60" y="160" font-family="Arial Narrow, sans-serif" font-size="48" fill="#ffffff" font-weight="bold">LIVE CLASS</text>
  <text x="60" y="210" font-family="Arial Narrow, sans-serif" font-size="48" fill="#c4f000" font-weight="bold">PLATFORM</text>
</svg>
