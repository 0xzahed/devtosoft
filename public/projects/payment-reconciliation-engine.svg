<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <rect width="1200" height="675" fill="#141414"/>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
    <linearGradient id="volt" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#c4f000" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#c4f000" stop-opacity="0.3"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#g1)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>
  <!-- glow -->
  <circle cx="950" cy="120" r="200" fill="#c4f000" fill-opacity="0.06"/>
  <!-- connection lines -->
  <g stroke="#c4f000" stroke-opacity="0.5" stroke-width="2">
    <line x1="150" y1="300" x2="450" y2="200"/>
    <line x1="450" y1="200" x2="750" y2="350"/>
    <line x1="750" y1="350" x2="1050" y2="250"/>
    <line x1="150" y1="300" x2="450" y2="450"/>
    <line x1="450" y1="450" x2="750" y2="500"/>
    <line x1="750" y1="500" x2="1050" y2="420"/>
  </g>
  <!-- nodes -->
  <g>
    <circle cx="150" cy="300" r="14" fill="#c4f000"/>
    <circle cx="450" cy="200" r="10" fill="#c4f000" fill-opacity="0.7"/>
    <circle cx="750" cy="350" r="10" fill="#c4f000" fill-opacity="0.7"/>
    <circle cx="1050" cy="250" r="14" fill="#c4f000"/>
    <circle cx="450" cy="450" r="8" fill="#c4f000" fill-opacity="0.5"/>
    <circle cx="750" cy="500" r="8" fill="#c4f000" fill-opacity="0.5"/>
    <circle cx="1050" cy="420" r="12" fill="#c4f000" fill-opacity="0.8"/>
  </g>
  <!-- card icons -->
  <g>
    <rect x="120" y="520" width="180" height="110" rx="8" fill="#1e1e1e" stroke="#c4f000" stroke-opacity="0.3"/>
    <rect x="140" y="540" width="40" height="28" rx="4" fill="#c4f000" fill-opacity="0.2"/>
    <line x1="140" y1="585" x2="280" y2="585" stroke="#c4f000" stroke-opacity="0.3" stroke-width="2"/>
    <line x1="140" y1="600" x2="240" y2="600" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>
    <rect x="140" y="610" width="100" height="8" rx="2" fill="#c4f000" fill-opacity="0.4"/>
  </g>
  <!-- bars -->
  <g>
    <rect x="900" y="500" width="30" height="120" fill="#c4f000" fill-opacity="0.3"/>
    <rect x="940" y="540" width="30" height="80" fill="#c4f000" fill-opacity="0.5"/>
    <rect x="980" y="480" width="30" height="140" fill="#c4f000" fill-opacity="0.7"/>
    <rect x="1020" y="560" width="30" height="60" fill="#c4f000" fill-opacity="0.4"/>
    <rect x="1060" y="520" width="30" height="100" fill="#c4f000"/>
  </g>
  <!-- label -->
  <text x="60" y="80" font-family="monospace" font-size="14" fill="#c4f000" letter-spacing="3">FINTECH / NORTHPAY</text>
  <text x="60" y="160" font-family="Arial Narrow, sans-serif" font-size="48" fill="#ffffff" font-weight="bold">PAYMENT</text>
  <text x="60" y="210" font-family="Arial Narrow, sans-serif" font-size="48" fill="#c4f000" font-weight="bold">RECONCILIATION</text>
</svg>
