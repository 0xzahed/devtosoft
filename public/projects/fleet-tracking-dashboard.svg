<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" fill="none">
  <rect width="1200" height="675" fill="#141414"/>
  <defs>
    <linearGradient id="g2" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1a1a1a"/>
      <stop offset="1" stop-color="#0d0d0d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#g2)"/>
  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="405" x2="1200" y2="405"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="200" y1="0" x2="200" y2="675"/>
    <line x1="400" y1="0" x2="400" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="800" y1="0" x2="800" y2="675"/>
    <line x1="1000" y1="0" x2="1000" y2="675"/>
  </g>
  <!-- glow -->
  <circle cx="200" cy="100" r="200" fill="#c4f000" fill-opacity="0.06"/>
  <!-- map routes -->
  <g stroke="#c4f000" stroke-opacity="0.4" stroke-width="2" stroke-dasharray="8 6">
    <path d="M 100 450 Q 300 380 500 420 T 900 350 T 1100 400"/>
    <path d="M 150 550 Q 400 480 600 520 T 1000 480"/>
  </g>
  <g stroke="#c4f000" stroke-opacity="0.6" stroke-width="2.5">
    <path d="M 200 300 L 450 250 L 700 320 L 950 280 L 1100 330"/>
  </g>
  <!-- vehicle markers -->
  <g>
    <circle cx="200" cy="300" r="16" fill="#c4f000"/>
    <circle cx="200" cy="300" r="6" fill="#141414"/>
    <circle cx="450" cy="250" r="12" fill="#c4f000" fill-opacity="0.7"/>
    <circle cx="450" cy="250" r="4" fill="#141414"/>
    <circle cx="700" cy="320" r="12" fill="#c4f000" fill-opacity="0.7"/>
    <circle cx="700" cy="320" r="4" fill="#141414"/>
    <circle cx="950" cy="280" r="12" fill="#c4f000" fill-opacity="0.7"/>
    <circle cx="950" cy="280" r="4" fill="#141414"/>
    <circle cx="1100" cy="330" r="16" fill="#c4f000"/>
    <circle cx="1100" cy="330" r="6" fill="#141414"/>
  </g>
  <!-- geofence circles -->
  <g stroke="#c4f000" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="4 4">
    <circle cx="450" cy="250" r="50"/>
    <circle cx="700" cy="320" r="60"/>
  </g>
  <!-- stats panel -->
  <g>
    <rect x="60" y="460" width="280" height="170" rx="8" fill="#1e1e1e" stroke="#c4f000" stroke-opacity="0.2"/>
    <text x="80" y="490" font-family="monospace" font-size="11" fill="#c4f000" letter-spacing="2">LIVE FLEET</text>
    <text x="80" y="530" font-family="Arial Narrow, sans-serif" font-size="36" fill="#ffffff">1,847</text>
    <text x="80" y="555" font-family="monospace" font-size="11" fill="#999">vehicles online</text>
    <rect x="80" y="575" width="240" height="6" rx="3" fill="#333"/>
    <rect x="80" y="575" width="210" height="6" rx="3" fill="#c4f000"/>
    <text x="80" y="610" font-family="monospace" font-size="10" fill="#666">14 cities · 12k events/min</text>
  </g>
  <!-- label -->
  <text x="60" y="80" font-family="monospace" font-size="14" fill="#c4f000" letter-spacing="3">LOGISTICS / FLEETIQ</text>
  <text x="60" y="160" font-family="Arial Narrow, sans-serif" font-size="48" fill="#ffffff" font-weight="bold">FLEET</text>
  <text x="60" y="210" font-family="Arial Narrow, sans-serif" font-size="48" fill="#c4f000" font-weight="bold">TRACKING</text>
</svg>
